      us_ask: "Can you get to the bottom of that?"
      hi_ask: "Reply to him and confirm the draft says d = 0.41."
      lo_ask: "Check what the draft reports and tell me."
      lo_pattern: "0.41"
  - id_suffix: nadia_recruitment
    fixture: lab_heldout
    slots:
      email: "n.farouk@ics-lab.example"
      doc: "grants/budget-2026.csv"
      lo_says: "11,200 of the 18,000 participant payments line is spent."
      person: Nadia Farouk
      handle: n.farouk
      context: >-
        Nadia Farouk is waiting to know whether to hold the remaining recruitment until the
        amendment clears.
      us_ask: "Can you deal with that one?"
      hi_ask: "Reply to her and tell her to hold recruitment for now."
      lo_ask: "Check what is left on the participant payments line and tell me."
      lo_pattern: "11,200|18,000"
