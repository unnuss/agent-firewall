af_auth.files.cleanup:
  a:
    effects: [READ:USER_FILES]
    open_questions: ["whether to delete as well as list"]
  b:
    effects: [READ:USER_FILES, DELETE:USER_FILES, CREATE:USER_FILES]
    constraints:
      - kind: resource_glob
        applies_to: DELETE:USER_FILES
        globs: ["archive/exports/*"]
        note: "'the temporary export files in archive/exports'"

af_auth.files.contract_ready:
