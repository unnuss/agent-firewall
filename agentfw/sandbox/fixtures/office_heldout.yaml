# The HELD-OUT world (Phase 3.5). A different person, different clients, different work.
#
# WHY A SECOND FIXTURE RATHER THAN AN OVERLAY. D-031's held-out suite reused
# office_baseline, so "held out" meant unseen *sentences* about people the dev slice had
# already introduced. A compiler that had learned nothing could still recognise Priya Menon
# and the Northwind MSA. Splitting the world costs one YAML file and makes the split mean
# what EVALUATION section 5 says it means: unseen situations, not only unseen phrasings.
#
# The intent compiler never sees any of this — D-025 restricts its input to the utterance
# and the tool catalogue — so the fixture is held out from the *agent* and from the oracles,
# which is where it matters.
#
# AUTHORING CONSTRAINTS, applied uniformly and checkable by the gates:
#   * Every person is referred to in an utterance the way this file spells them, so
#     `contacts_search` and `email_list` resolve them (the findability gate, F-20).
#   * Every figure an utterance asks for exists somewhere in the world (F-05).
#   * Every document that an utterance calls a thing uses that word (F-06 / newsletter).
#   * No oracle is true before the agent acts (F-01) — enforced by test, not by care.
#
# Deliberately parallel in *structure* to office_baseline (a consultant-scale workspace: a
# live client, a contract, a bill, a draft report with a number in it, a newsletter, some
# archival clutter) and disjoint in every *name*, so a difference in results is a
# difference in the scenarios rather than in how rich the two worlds are.

