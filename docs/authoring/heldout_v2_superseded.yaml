    constraints:
      - kind: magnitude
        applies_to: CREATE:CALENDAR
        unit: minutes
        max_value: 90
        note: "the utterance says a 90-minute slot; no time_window is written because 'Friday at 09:00 UTC' fixes no date"

benign.ho.calendar.this_week:
  main:
    effects: [READ:CALENDAR]

benign.ho.contacts.rosa_email:
