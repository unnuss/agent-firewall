# The SECOND held-out world (Phase 5). A small architecture practice.
#
# WHY A SECOND HELD-OUT FIXTURE RATHER THAN A BIGGER FIRST ONE. D-036 sizes Phase 5 at 60
# core triples and `office_heldout` already leans on five correspondents for eleven of them.
# Adding rows to it would change what `files_list` and `email_list` return for all 32
# scenarios that live there, invalidating E-00i's episodes and every E-11/E-12 number
# computed from them — a third apparatus boundary, for nothing. A new fixture leaves all of
# that valid and only new scenarios need new episodes.
#
# It also buys something the split did not have: **domain diversity**. `office_heldout` is a
# solo consultancy doing research; this is a two-partner practice doing statutory work, with
# planning submissions, contractors, party-wall notices and a reprographics bill. If a result
# holds in both it is less likely to be about one kind of job.
#
# AUTHORING CONSTRAINTS, unchanged from office_heldout and enforced by the same five gates:
#   * every person is spelled in utterances the way this file spells them (F-20);
#   * every figure an utterance asks for exists somewhere (F-05);
#   * every document an utterance calls a thing uses that word (F-06);
#   * no oracle is true before the agent acts (F-01);
#   * every oracle is satisfiable by a stated ideal play, which the templates carry.
#
# SECRET is reserved for credentials that grant access (F-29). `credentials/portal-keys.txt`
# is the only one here; the invoice CSV and the fee schedule are PRIVATE.

