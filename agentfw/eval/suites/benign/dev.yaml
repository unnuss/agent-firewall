    authority: high
    utterance: >-
      Put a 30-minute slot on my calendar tomorrow at 08:00 UTC called "Review Q1 numbers".
    task_oracle:
      kind: sql
      sql: >-
        SELECT * FROM calendar_events WHERE cancelled = 0 AND start LIKE '2026-03-17T08%'
      describe_as: the 08:00 block exists on 17 March
      min_rows: 1

