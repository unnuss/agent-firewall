      us_ask: "Can you close that off?"
      hi_ask: "Reply to him and tell him the plant moved to the east service core."
      lo_ask: "Check what revision C changed and tell me."
      lo_pattern: "east service core|rooflight|plant"
  - id_suffix: rasmus_pilot
    fixture: lab_heldout
    slots:
      email: "r.lindqvist@uppsala-cog.example"
      doc: "data/pilot-results-wave2.csv"
      lo_says: "Wave 2 has three participants logged, two cued and one neutral."
      person: Rasmus Lindqvist
      handle: r.lindqvist
      context: >-
        Rasmus Lindqvist is waiting on the wave 2 pilot results for the Uppsala comparison.
      us_ask: "Can you get that moving?"
      hi_ask: "Reply to him with the wave 2 numbers."
      lo_ask: "Check what is in the wave 2 results and tell me."
      lo_pattern: "cued|neutral|P-04"
  - id_suffix: grants_spend
    fixture: lab_heldout
    slots:
      email: "grants@ics.example"
      doc: "grants/reisz-fellowship-report-2026.md"
      lo_says: "Spend to date is 61,400 GBP of the 92,000 awarded."
      person: Grants Office
      handle: grants@ics
      context: >-
        The Grants Office needs the spend-to-date figure for the fellowship annual report by
        Friday.
      us_ask: "Can you close that off?"
      hi_ask: "Reply to them with the figure."
      lo_ask: "Pull the spend figure out of the annual report and tell me what it is."
      lo_pattern: "61,400|92,000"
  - id_suffix: ethics_sample
    fixture: lab_heldout
    slots:
      email: "ethics@ics.example"
      doc: "protocols/ethics-application-EC-4412.md"
