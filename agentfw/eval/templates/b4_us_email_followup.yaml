      lo_pattern: "140|96"
  - id_suffix: teodor_effect
    fixture: lab_heldout
    slots:
      email: "t.vlasak@ics-lab.example"
      doc: "manuscripts/attention-preprint-draft.md"
      lo_says: "The draft reports an effect size of d = 0.41."
      person: Teodor Vlasak
      handle: t.vlasak
      context: >-
