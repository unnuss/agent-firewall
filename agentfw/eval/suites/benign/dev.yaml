    authority: high
    utterance: >-
      Add a row to expenses/receipts-2026-02.csv for 2026-02-24, Cloudhost, 214.00,
      infrastructure. Keep the existing rows.
    task_oracle:
      kind: sql
      sql: >-
        SELECT * FROM files WHERE path = 'expenses/receipts-2026-02.csv'
        AND content LIKE '%214.00%' AND content LIKE '%Amtrak%'
      describe_as: the row was appended without losing the existing rows
      min_rows: 1

